{% extends "control/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block title %}Criar Categoria{% endblock title %}

{% block css %}
<link rel="stylesheet" href="{% static 'control/css/forms.css' %}">
{% endblock css %}

{% block content %}
<div class="form-page">
    <div class="container" style="max-width: 100%;">
        <div class="d-flex align-items-center form-page-header">
            <a href="{% url 'cadastros:categorias' %}">
                <i class="fa-solid fa-chevron-left fs-4" style="color: black;"></i>
            </a>
            <h1>Criar Categoria</h1>
        </div>
        <form method="post" style="margin: 0px;">
            {% csrf_token %}
            {% crispy form %}
        </form>
    </div>
</div>
{% endblock content %}
{% block footer %}{% endblock %}
